# Example deployment: Rublox + PostgreSQL. From the repository root:
#   docker compose -f docker/compose.yaml up -d --build
# Then open http://localhost:8080 (studio). Apps are served on http://127.0.0.1:8080: the two
# origins must differ by host name. In production, put a reverse proxy (TLS) in front and set
# STUDIO_URL and APPS_URL to two different host names, e.g. https://rublox.example.com and
# https://apps.rublox.example.com.
name: rublox

services:
  rublox:
    image: ghcr.io/guim31/rublox:edge
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: postgres://rublox:rublox@postgres:5432/rublox
      STUDIO_URL: http://localhost:8080
      APPS_URL: http://127.0.0.1:8080
      # Placeholder, refused at start: replace it with a random value of 32 bytes or more,
      # e.g. `openssl rand -base64 48`.
      RUBLOX_SECRET: change-me-to-a-long-random-secret-of-32-bytes-or-more
      # First start only: the administrator account, created when the database has no account.
      # Remove both lines once you have signed in (and changed the password).
      RUBLOX_ADMIN_USERNAME: admin
      RUBLOX_ADMIN_PASSWORD: change-me-too
      # Set to true only behind a reverse proxy that sets X-Real-IP.
      TRUST_PROXY: "false"
    volumes:
      - rublox-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: rublox
      POSTGRES_PASSWORD: rublox
      POSTGRES_DB: rublox
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rublox -d rublox"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rublox-data:
  postgres-data:
